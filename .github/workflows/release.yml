name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vcd30_player.exe
            archive: vcd30player-${{ github.ref_name }}-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: vcd30_player
            archive: vcd30player-${{ github.ref_name }}-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Build Release
        run: cargo build --release

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item target/release/${{ matrix.binary }} staging/
          Copy-Item README.md staging/
          Copy-Item README_EN.md staging/
          Copy-Item LICENSE-MIT staging/
          Copy-Item LICENSE-APACHE staging/
          Copy-Item CHANGELOG.md staging/ -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG_CN.md staging/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.archive }}

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          cp target/release/${{ matrix.binary }} staging/
          cp README.md README_EN.md LICENSE-MIT LICENSE-APACHE staging/
          cp CHANGELOG.md CHANGELOG_CN.md staging/ || true
          tar -czvf ${{ matrix.archive }} -C staging .

      - name: Upload build archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish Release & Distribute to Cloudflare R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Release Notes, Checksums, and version.json
        shell: bash
        env:
          PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || 'https://content.vcd30player.app.nimitz.io' }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          python3 -c "
          import os, sys, re, hashlib, json, datetime

          tag = sys.argv[1]
          ver = tag.lstrip('v')
          public_url = sys.argv[2].rstrip('/')

          assets_dir = 'release-assets'
          platforms = {}
          checksum_lines = []

          for fname in sorted(os.listdir(assets_dir)):
              fpath = os.path.join(assets_dir, fname)
              if not os.path.isfile(fpath):
                  continue
              h = hashlib.sha256()
              with open(fpath, 'rb') as f:
                  while chunk := f.read(65536):
                      h.update(chunk)
              sha256 = h.hexdigest()
              size = os.path.getsize(fpath)
              checksum_lines.append(f'{sha256}  {fname}\n')

              if 'windows-x64' in fname:
                  plat_key = 'windows-x64'
              elif 'linux-x64' in fname:
                  plat_key = 'linux-x64'
              else:
                  plat_key = fname

              platforms[plat_key] = {
                  'filename': fname,
                  'url': f'{public_url}/{tag}/{fname}',
                  'sha256': sha256,
                  'size': size
              }

          # Write checksums.txt into release-assets
          with open(os.path.join(assets_dir, 'checksums.txt'), 'w', encoding='utf-8') as f:
              f.writelines(checksum_lines)

          def extract_section(file_path, version):
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
              except Exception as e:
                  print(f'Note: Could not open {file_path}: {e}', file=sys.stderr)
                  return ''
              pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              m = re.search(pattern, content, re.DOTALL)
              if not m:
                  print(f'Note: Version {version} not found in {file_path}', file=sys.stderr)
                  return ''
              notes = m.group(1).strip()
              notes = re.sub(r'(?:\r?\n\s*---\s*)+\Z', '', notes).strip()
              return notes

          cn_notes = extract_section('CHANGELOG_CN.md', ver)
          en_notes = extract_section('CHANGELOG.md', ver)

          release_body = []
          if cn_notes:
              release_body.append(f'## {tag} 更新\n\n' + cn_notes)
          if en_notes:
              release_body.append(f'## {tag} Update\n\n' + en_notes)

          final_body = '\n\n---\n\n'.join(release_body)
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as f:
              f.write(final_body + '\n')

          vdata = {
              'version': ver,
              'tag': tag,
              'release_date': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'changelog': {
                  'zh': cn_notes,
                  'en': en_notes
              },
              'platforms': platforms
          }
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(vdata, f, ensure_ascii=False, indent=2)
          " "$TAG" "$PUBLIC_URL"

      - name: Check Cloudflare R2 Secrets
        id: check-r2
        env:
          R2_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT || secrets.R2_ENDPOINT || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "$R2_ENDPOINT" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET_NAME" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::Cloudflare R2 secrets are not fully configured (R2_S3_ENDPOINT/R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME). Skipping R2 distribution."
          fi

      - name: Distribute to Cloudflare R2
        if: steps.check-r2.outputs.configured == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_RAW_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT || secrets.R2_ENDPOINT || secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # If user passed full URL (e.g. https://xxx.r2.cloudflarestorage.com), use it directly;
          # otherwise construct it from the Account ID.
          if [[ "$R2_RAW_ENDPOINT" =~ ^https?:// ]]; then
            ENDPOINT="${R2_RAW_ENDPOINT%/}"
          else
            ENDPOINT="https://${R2_RAW_ENDPOINT}.r2.cloudflarestorage.com"
          fi

          TAG="${GITHUB_REF_NAME}"

          echo "Using S3 Endpoint: $ENDPOINT"
          echo "Uploading release assets to Cloudflare R2: s3://${R2_BUCKET_NAME}/${TAG}/ ..."
          aws s3 cp release-assets/ "s3://${R2_BUCKET_NAME}/${TAG}/" \
            --recursive \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"

          echo "Uploading version.json to Cloudflare R2: s3://${R2_BUCKET_NAME}/version.json ..."
          aws s3 cp version.json "s3://${R2_BUCKET_NAME}/version.json" \
            --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=60, s-maxage=60, no-cache"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            version.json
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

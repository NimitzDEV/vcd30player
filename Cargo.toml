[package]
name = "vcd30_player"
version = "0.3.1"
edition = "2024"
authors = ["NimitzDEV"]
description = "A cross-platform player and interactive runtime for VCD 3.0 discs"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NimitzDEV/vcd30player"
keywords = ["vcd", "player", "multimedia", "retro", "emulator"]
categories = ["multimedia::video", "multimedia::audio", "emulators"]

[dependencies]
eframe = "0.36.1"
rfd = "0.17.2"
rodio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
self-replace = "1.5"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
sys-locale = "0.3"

[build-dependencies]
cc = "1.2"
winres = "0.1.12"
